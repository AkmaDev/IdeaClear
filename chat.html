<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IdeaClear — Décrire mon idée</title>
<meta name="description" content="Décrivez votre idée à IdeaClear et obtenez un cahier des charges structuré et un prompt prêt à coller dans Claude Code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f0e;
    --panel: #101614;
    --panel-border: #1c2621;
    --text: #eef2f0;
    --text-muted: #a9b6b0;
    --text-dim: #7d8b85;
    --text-faint: #5f6d67;
    --green: #3ddc97;
    --green-hover: #5be8ac;
    --green-soft: #8fe0b8;
    --blue: #4f9dff;
    --blue-soft: #6fb8ff;
    --red-soft: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  ::selection { background: var(--green); color: #06110d; }
  @keyframes pulseDot { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  nav { display:flex; align-items:center; justify-content:space-between; padding:20px 32px; max-width:900px; margin:0 auto; }
  .logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
  .logo .mark { width:26px; height:26px; border-radius:8px; background:linear-gradient(135deg,var(--green),var(--blue)); }
  .logo span { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:17px; letter-spacing:-0.02em; color:var(--text); }
  nav a.back { color:#9aa8a2; text-decoration:none; font-size:14px; font-weight:500; }
  nav a.back:hover { color:var(--text); }

  main { max-width:760px; margin:0 auto; padding:16px 24px 140px; }

  .intro { text-align:center; padding:24px 8px 32px; }
  .intro h1 { font-family:'Space Grotesk',sans-serif; font-size:26px; font-weight:600; margin:0 0 10px; letter-spacing:-0.01em; }
  .intro p { color:var(--text-muted); font-size:15px; margin:0; }

  #messages { display:flex; flex-direction:column; gap:16px; margin-bottom:24px; }
  .msg-row { display:flex; flex-direction:column; gap:6px; animation:fadeUp .3s ease both; }
  .msg-row.user { align-items:flex-end; }
  .msg-row.bot { align-items:flex-start; }
  .bubble { max-width:82%; padding:13px 16px; font-size:14.5px; line-height:1.6; white-space:pre-wrap; }
  .bubble.user { border-radius:14px 14px 4px 14px; background:#1a2622; border:1px solid #26372f; color:#dbe7e1; }
  .bubble.bot { border-radius:14px 14px 14px 4px; background:#182028; border:1px solid #1f2b35; color:#dbe7e1; }
  .bubble.error { background:#241416; border:1px solid #3a1f22; color:var(--red-soft); }

  .typing { display:flex; align-items:center; gap:6px; padding:13px 16px; }
  .typing span { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulseDot 1.2s ease-in-out infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }

  #composer {
    position:fixed; bottom:0; left:0; right:0;
    background:linear-gradient(180deg, transparent, var(--bg) 30%);
    padding:24px 24px 28px;
  }
  #composer form {
    max-width:760px; margin:0 auto;
    display:flex; gap:10px; align-items:flex-end;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:14px;
    padding:8px 8px 8px 18px;
  }
  #composer textarea {
    flex:1; resize:none; background:transparent; border:none; outline:none;
    color:var(--text); font-family:'Inter',sans-serif; font-size:15px; line-height:1.5;
    padding:10px 0; max-height:120px;
  }
  #composer textarea::placeholder { color:var(--text-faint); }
  #composer button {
    background:var(--green); color:#06110d; border:none; border-radius:10px;
    padding:12px 18px; font-size:14px; font-weight:600; cursor:pointer; flex-shrink:0;
  }
  #composer button:hover { background:var(--green-hover); }
  #composer button:disabled { opacity:.5; cursor:not-allowed; }

  .deliverables { display:flex; flex-direction:column; gap:16px; margin-top:8px; }
  .deliverable-card {
    background:var(--panel); border:1px solid var(--panel-border); border-radius:16px; padding:24px;
    display:flex; flex-direction:column; gap:12px;
  }
  .deliverable-card h3 { font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; margin:0; }
  .deliverable-card pre {
    background:var(--bg); border:1px solid var(--panel-border); border-radius:10px;
    padding:16px; font-size:13px; line-height:1.6; color:#c3cec8; white-space:pre-wrap;
    max-height:280px; overflow-y:auto; font-family:'Inter',sans-serif; margin:0;
  }
  .deliverable-actions { display:flex; gap:10px; flex-wrap:wrap; }
  .deliverable-actions button {
    background:transparent; border:1px solid var(--panel-border); color:var(--text);
    border-radius:8px; padding:8px 14px; font-size:13px; font-weight:500; cursor:pointer;
  }
  .deliverable-actions button:hover { border-color:var(--green); color:var(--green); }

  /* Écran "Et maintenant ?" */
  #next-steps { margin-top:8px; animation:fadeUp .3s ease both; }
  .ns-intro {
    background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
    padding:16px 18px; margin-bottom:18px; font-size:14.5px; line-height:1.6;
  }
  .ns-intro p { margin:0 0 8px; }
  .ns-intro p:last-child { margin-bottom:0; }
  .branch-grid { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .branch-card {
    display:flex; align-items:center; gap:12px; text-align:left; width:100%;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:14px;
    padding:14px 16px; cursor:pointer; font-family:inherit; color:var(--text);
  }
  .branch-card:hover { border-color:var(--green); }
  .branch-card.active { border-color:var(--green); background:rgba(61,220,151,.06); }
  .branch-card .emoji { font-size:20px; flex-shrink:0; }
  .branch-card .label { font-weight:600; font-size:14.5px; }
  .branch-card .desc { color:var(--text-dim); font-size:12.5px; margin-top:2px; }
  .branch-content {
    display:none; background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
    padding:18px 20px; margin-bottom:20px; font-size:14px; line-height:1.6;
  }
  .branch-content.show { display:block; animation:fadeUp .2s ease both; }
  .branch-content p { margin:0 0 10px; }
  .branch-content p:last-child { margin-bottom:0; }
  .ns-steps { list-style:none; margin:12px 0 0; padding:0; counter-reset:step; }
  .ns-steps li { counter-increment:step; position:relative; padding:0 0 14px 34px; }
  .ns-steps li:last-child { padding-bottom:0; }
  .ns-steps li::before {
    content:counter(step); position:absolute; left:0; top:0; width:22px; height:22px;
    background:var(--green); color:#06110d; border-radius:50%; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .ns-link { font-size:13px; color:var(--text-dim); margin-top:12px; }
  .checklist-box {
    background:var(--panel); border:1px solid var(--panel-border); border-radius:16px;
    padding:18px 20px;
  }
  .checklist-box h3 { font-size:14px; margin:0 0 12px; font-family:'Space Grotesk',sans-serif; }
  .check-item {
    display:flex; align-items:flex-start; gap:10px; padding:8px 0;
    border-top:1px solid var(--panel-border); font-size:13.5px;
  }
  .check-item:first-of-type { border-top:none; }
  .check-item .box {
    width:16px; height:16px; flex:0 0 16px; border:1px solid var(--text-dim);
    border-radius:4px; margin-top:2px;
  }

  @media (max-width: 600px) {
    nav { padding:16px 20px; }
    main { padding:8px 16px 150px; }
    .bubble { max-width:90%; }
  }
</style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <div class="mark"></div>
    <span>IdeaClear</span>
  </a>
  <a class="back" href="index.html">← Retour</a>
</nav>

<main>
  <div class="intro">
    <h1>Décrivez votre idée, avec vos mots</h1>
    <p>Pas besoin de vocabulaire technique — on y va étape par étape.</p>
  </div>
  <div id="messages"></div>
  <div id="deliverables" class="deliverables"></div>
  <div id="next-steps" style="display:none;"></div>
</main>

<div id="composer">
  <form id="chatForm">
    <textarea id="input" rows="1" placeholder="Écrivez votre message…" autofocus></textarea>
    <button type="submit" id="sendBtn">Envoyer</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const deliverablesEl = document.getElementById('deliverables');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  const history = [];
  let conversationEnded = false;

  const BOT_GREETING = "Bonjour 👋 Je suis IdeaClear. Racontez-moi votre idée — même vague, même en une phrase — et on va la rendre concrète ensemble. Qu'avez-vous en tête ?";

  addBubble('bot', BOT_GREETING);
  history.push({ role: 'assistant', content: BOT_GREETING });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (conversationEnded) return;

    const text = input.value.trim();
    if (!text) return;

    addBubble('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    input.style.height = 'auto';
    setBusy(true);

    const typingEl = addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      const data = await res.json();
      typingEl.remove();

      if (!res.ok) {
        addBubble('bot', data.error || "Une erreur est survenue.", true);
        setBusy(false);
        return;
      }

      addBubble('bot', data.reply);
      history.push({ role: 'assistant', content: data.reply });

      if (data.deliverables) {
        renderDeliverables(data.deliverables);
        conversationEnded = true;
      }
    } catch (err) {
      typingEl.remove();
      addBubble('bot', "Impossible de contacter l'assistant. Vérifiez votre connexion et réessayez.", true);
    }

    setBusy(false);
  });

  function setBusy(busy) {
    sendBtn.disabled = busy || conversationEnded;
    input.disabled = busy || conversationEnded;
  }

  function addBubble(who, text, isError) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (who === 'user' ? 'user' : 'bot');
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (who === 'user' ? 'user' : (isError ? 'error' : 'bot'));
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = '<div class="bubble bot typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(row);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    return row;
  }

  function renderDeliverables(d) {
    deliverablesEl.innerHTML = `
      <div class="deliverable-card">
        <h3>📋 Cahier des charges</h3>
        <pre id="cdcText"></pre>
        <div class="deliverable-actions">
          <button type="button" data-copy="cdcText">Copier</button>
          <button type="button" id="downloadCdc">Télécharger (.md)</button>
          <button type="button" id="downloadCdcPdf">Télécharger (.pdf)</button>
        </div>
      </div>
      <div class="deliverable-card">
        <h3>&gt;_ Prompt pour Claude Code</h3>
        <pre id="promptText"></pre>
        <div class="deliverable-actions">
          <button type="button" data-copy="promptText">Copier</button>
        </div>
      </div>
    `;
    document.getElementById('cdcText').textContent = d.cahierDesCharges || '';
    document.getElementById('promptText').textContent = d.promptClaude || '';

    deliverablesEl.querySelectorAll('[data-copy]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const el = document.getElementById(btn.getAttribute('data-copy'));
        navigator.clipboard.writeText(el.textContent);
        const original = btn.textContent;
        btn.textContent = 'Copié !';
        setTimeout(() => (btn.textContent = original), 1500);
      });
    });

    document.getElementById('downloadCdc').addEventListener('click', () => {
      const blob = new Blob([d.cahierDesCharges || ''], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'cahier-des-charges.md';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('downloadCdcPdf').addEventListener('click', () => {
      openPrintableCdc(d.cahierDesCharges || '');
    });

    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    renderNextSteps();
  }

  // Formatage minimal Markdown → HTML pour l'aperçu imprimable (titres, listes, gras).
  function markdownToPrintableHtml(md) {
    const escape = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const lines = escape(md).split('\n');
    let html = '';
    let inList = false;
    for (const line of lines) {
      const bold = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (/^##\s+/.test(bold)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<h2>${bold.replace(/^##\s+/, '')}</h2>`;
      } else if (/^#\s+/.test(bold)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<h1>${bold.replace(/^#\s+/, '')}</h1>`;
      } else if (/^[-*]\s+/.test(bold)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${bold.replace(/^[-*]\s+/, '')}</li>`;
      } else if (bold.trim() === '' || bold.trim() === '---') {
        if (inList) { html += '</ul>'; inList = false; }
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<p>${bold}</p>`;
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

  function openPrintableCdc(markdown) {
    const win = window.open('', '_blank');
    if (!win) return;
    win.document.write(`<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cahier des charges — IdeaClear</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; color: #1a1a1a; max-width: 720px; margin: 40px auto; padding: 0 24px; line-height: 1.6; }
  h1 { font-size: 26px; border-bottom: 2px solid #3ddc97; padding-bottom: 8px; }
  h2 { font-size: 18px; margin-top: 28px; color: #0e6b45; }
  ul { padding-left: 22px; }
  li { margin-bottom: 6px; }
  p { margin: 8px 0; }
</style>
</head>
<body>${markdownToPrintableHtml(markdown)}</body>
</html>`);
    win.document.close();
    win.focus();
    win.onload = () => win.print();
    setTimeout(() => win.print(), 300);
  }

  function renderNextSteps() {
    const el = document.getElementById('next-steps');
    el.style.display = 'block';
    el.innerHTML = `
      <div class="ns-intro">
        <p>Vous avez votre cahier des charges et votre prompt. 🎉</p>
        <p>Une dernière question pour savoir comment vous accompagner à partir d'ici :</p>
      </div>
      <div class="branch-grid" id="branchGrid">
        <button type="button" class="branch-card" data-target="a">
          <span class="emoji">💻</span>
          <span>
            <div class="label">J'ai déjà un outil pour coder</div>
            <div class="desc">Claude Code, Cursor, ChatGPT, GitHub Copilot...</div>
          </span>
        </button>
        <button type="button" class="branch-card active" data-target="b">
          <span class="emoji">🌱</span>
          <span>
            <div class="label">Je n'ai jamais codé</div>
            <div class="desc">Je pars de zéro, j'ai besoin d'être guidé(e)</div>
          </span>
        </button>
        <button type="button" class="branch-card" data-target="c">
          <span class="emoji">🤝</span>
          <span>
            <div class="label">Je préfère être accompagné(e)</div>
            <div class="desc">Trouver quelqu'un pour m'aider ou coder à ma place</div>
          </span>
        </button>
      </div>
      <div class="branch-content" id="content-a">
        <p><strong>Parfait.</strong> Ouvrez votre outil, collez le prompt ci-dessus tel quel, et laissez-le vous répondre — il va vous proposer une architecture avant d'écrire la moindre ligne de code. Répondez-lui comme vous me répondez à moi : en langage simple, il reformulera si besoin.</p>
        <div class="ns-link">Le prompt fonctionne aussi avec Cursor, ChatGPT et GitHub Copilot.</div>
      </div>
      <div class="branch-content show" id="content-b">
        <p>Voici comment démarrer, sans rien deviner :</p>
        <ol class="ns-steps">
          <li><strong>Choisissez un point de départ simple.</strong> Par défaut on recommande Claude Code (gratuit pour commencer). Vous pouvez aussi rester 100% dans le navigateur avec Bolt.new ou Replit, sans rien installer.</li>
          <li><strong>Créez un compte</strong> sur la plateforme choisie — un email suffit, 2 minutes.</li>
          <li><strong>Collez le prompt généré</strong> dans la conversation avec l'outil.</li>
          <li><strong>Suivez ses instructions une par une.</strong> Si un mot vous bloque, demandez-lui "explique-moi ça simplement" — ça marche aussi avec lui.</li>
        </ol>
      </div>
      <div class="branch-content" id="content-c">
        <p>C'est un choix tout à fait valable — coder soi-même n'est pas obligatoire pour lancer un projet.</p>
        <p>Deux options : transmettre ce cahier des charges à un développeur freelance (il est fait pour ça), ou un accompagnement pas-à-pas avec un humain.</p>
      </div>
      <div class="checklist-box">
        <h3>✅ Vos 5 premières actions cette semaine</h3>
        <div class="check-item"><span class="box"></span><span>Installer / créer un compte sur l'outil choisi</span></div>
        <div class="check-item"><span class="box"></span><span>Coller le prompt et lire sa première réponse en entier avant de répondre</span></div>
        <div class="check-item"><span class="box"></span><span>Créer un compte gratuit sur le service d'hébergement suggéré (Firebase / Supabase)</span></div>
        <div class="check-item"><span class="box"></span><span>Faire tourner une toute première version, même minuscule, sur votre téléphone</span></div>
        <div class="check-item"><span class="box"></span><span>Noter une question qui reste floue, pour la reposer la semaine suivante</span></div>
      </div>
    `;

    el.querySelectorAll('.branch-card').forEach((card) => {
      card.addEventListener('click', () => {
        el.querySelectorAll('.branch-card').forEach((c) => c.classList.remove('active'));
        el.querySelectorAll('.branch-content').forEach((c) => c.classList.remove('show'));
        card.classList.add('active');
        document.getElementById('content-' + card.dataset.target).classList.add('show');
      });
    });

    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
</script>

</body>
</html>
